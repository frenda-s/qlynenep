name: Build Android APK (Capacitor CLI)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Cloudflare Workers backend URL'
        required: false
        default: 'https://nenepos.frenda.workers.dev'
        type: string
      build_type:
        description: 'APK build type (release uses Capacitor CLI, debug uses gradle assembleDebug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
          run_install: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Approve build scripts (workerd)
        run: pnpm approve-builds workerd || true

      - name: Build Web Assets and Sync Capacitor
        env:
          CAPACITOR_SERVER_URL: ${{ github.event.inputs.server_url || secrets.APP_URL || 'https://nenepos.frenda.workers.dev' }}
        run: pnpm build:mobile

      - name: Make Gradlew executable
        run: chmod +x android/gradlew

      - name: Prepare Keystore for Signing
        id: keystore
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/android"
          KEYSTORE_PATH="${GITHUB_WORKSPACE}/android/ci-signing.keystore"
          KEYSTORE_PASS="${{ secrets.KEYSTORE_PASSWORD }}"
          KEY_ALIAS="${{ secrets.KEY_ALIAS }}"
          KEY_ALIAS_PASS="${{ secrets.KEY_PASSWORD }}"

          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Using keystore from KEYSTORE_BASE64 Secret..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$KEYSTORE_PATH"
          elif [ -n "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" ]; then
            echo "Using keystore from SIGNING_KEYSTORE_BASE64 Secret..."
            echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > "$KEYSTORE_PATH"
          else
            echo "No custom keystore secret provided. Generating temporary CI signing keystore..."
            KEYSTORE_PASS="nenepos_build_secret"
            KEY_ALIAS="nenepos"
            KEY_ALIAS_PASS="nenepos_build_secret"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$KEYSTORE_PASS" \
              -keypass "$KEY_ALIAS_PASS" \
              -dname "CN=NeNepOS, OU=App, O=NeNepOS, L=City, S=State, C=VN"
          fi

          cp "$KEYSTORE_PATH" "${GITHUB_WORKSPACE}/ci-signing.keystore" 2>/dev/null || true

          echo "::add-mask::$KEYSTORE_PASS"
          echo "::add-mask::$KEY_ALIAS_PASS"
          echo "path=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"
          echo "pass=$KEYSTORE_PASS" >> "$GITHUB_OUTPUT"
          echo "alias=$KEY_ALIAS" >> "$GITHUB_OUTPUT"
          echo "alias_pass=$KEY_ALIAS_PASS" >> "$GITHUB_OUTPUT"

      - name: Build and Sign APK
        env:
          KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASS: ${{ steps.keystore.outputs.pass }}
          KEYSTORE_ALIAS: ${{ steps.keystore.outputs.alias }}
          KEYSTORE_ALIAS_PASS: ${{ steps.keystore.outputs.alias_pass }}
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            echo "Building Debug APK with Gradle..."
            cd android && ./gradlew assembleDebug --stacktrace
            cd ..
          else
            echo "Building Release APK with Gradle..."
            cd android && ./gradlew assembleRelease --stacktrace
            cd ..
          fi

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name zipalign | sort -V | tail -n 1)
          echo "Using apksigner at: $APKSIGNER"
          echo "Using zipalign at: $ZIPALIGN"

          RAW_APK=$(find android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          if [ -z "$RAW_APK" ]; then
            echo "Error: No APK generated by Gradle!"
            exit 1
          fi
          echo "Inspecting raw APK: $RAW_APK"

          if ! "$APKSIGNER" verify "$RAW_APK" 2>/dev/null; then
            echo "APK not signed yet. Aligning and signing with apksigner (v1 + v2 + v3)..."
            ALIGNED_APK="/tmp/app-aligned.apk"
            "$ZIPALIGN" -f -p 4 "$RAW_APK" "$ALIGNED_APK" || cp "$RAW_APK" "$ALIGNED_APK"
            "$APKSIGNER" sign \
              --ks "$KEYSTORE_PATH" \
              --ks-pass "pass:$KEYSTORE_PASS" \
              --ks-key-alias "$KEYSTORE_ALIAS" \
              --key-pass "pass:$KEYSTORE_ALIAS_PASS" \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --out "$RAW_APK" "$ALIGNED_APK"
          fi

          echo "Verifying APK Signature:"
          "$APKSIGNER" verify --verbose "$RAW_APK"

      - name: Collect and Rename APK
        run: |
          mkdir -p dist-apk
          APK_FILE=$(find android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: No generated APK file found!"
            exit 1
          fi
          echo "Found APK: $APK_FILE"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          cp "$APK_FILE" "dist-apk/NeNepOS-${SHORT_SHA}.apk"
          cp "$APK_FILE" "dist-apk/NeNepOS-latest.apk"
          ls -la dist-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeNepOS-APK
          path: dist-apk/*.apk
          retention-days: 30

      - name: Publish Release (if Git Tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-apk/*.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
